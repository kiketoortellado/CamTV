name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk CamTV.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CamTV
          path: CamTV.apk

      - name: Publicar en Releases (link directo para el Fire Stick)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CamTV - última versión
          files: CamTV.apk
          make_latest: true

